  /api/library/books/:
    get:
      operationId: library_books_list
      description: CRUD для книг. Читать — все авторизованные, изменять — только библиотекарь.
      parameters:
      - in: query
        name: authors
        schema:
          type: array
          items:
            type: integer
        explode: true
        style: form
      - in: query
        name: available
        schema:
          type: boolean
        description: Только доступные
      - in: query
        name: genres
        schema:
          type: array
          items:
            type: integer
        explode: true
        style: form
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: publication_year
        schema:
          type: integer
      - in: query
        name: publication_year_max
        schema:
          type: integer
        description: Год издания до
      - in: query
        name: publication_year_min
        schema:
          type: integer
        description: Год издания от
      - in: query
        name: publisher
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - library
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookReadList'
          description: ''
