  /api/library/loans/:
    get:
      operationId: library_loans_list
      description: |-
        CRUD для выдач.

        - Библиотекарь видит все выдачи, может создавать/менять.
        - Читатель видит только свои выдачи (read-only).
      parameters:
      - in: query
        name: book
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          title: Статус
          enum:
          - issued
          - lost
          - returned
        description: |-
          * `issued` - Выдана
          * `returned` - Возвращена
          * `lost` - Потеряна
      - in: query
        name: user
        schema:
          type: integer
      tags:
      - library
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLoanReadList'
          description: ''
    post:
